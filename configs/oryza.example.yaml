# 仅描述接入契约；须先准备真实原生输入、编译产物和逐日输出格式。
# 路径相对于此配置文件；先用 oryza-prepare 创建对应材料工作区。
workdir: ../artifacts/oryza_native_run
executable: ../artifacts/oryza_native_run/bin/ricesim
asset_manifest: ../artifacts/oryza_native_run/assets.yaml
output: output/RES.DAT
normalized_output: ../artifacts/oryza_native_run/normalized/trajectory.csv
season_id: null
year: null
site_id: null
variety: null
timeout: 300
mapping_verified: false
# 映射必须依据实际日输出的表头核验；YEAR/DOY 是格式示例。
# 如果表中有 ISO 日期列，可用 date: 日期列名，替代 year/day_of_year。
mapping:
  year: YEAR
  day_of_year: DOY
  lai_m2_m2: LAI
  biomass_aboveground_kg_ha: WAGT
  storage_organ_dry_kg_ha: WSO
  dvs: DVS
